<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apna AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060814;
      --card-bg: rgba(16, 23, 42, 0.75);
      --border: rgba(56, 189, 248, 0.25);
      --neon-blue: #00d2ff;
      --neon-purple: #9333ea;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Noto Sans Devanagari', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.15), transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(147, 51, 234, 0.15), transparent 60%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation */
    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(6, 8, 20, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-glow {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--neon-blue);
      box-shadow: 0 0 10px var(--neon-blue);
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-search {
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--neon-blue);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-search:active {
      background: rgba(0, 210, 255, 0.25);
    }

    /* Notification Alert */
    #alert-box {
      display: none;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      font-size: 0.82rem;
      padding: 8px 14px;
      text-align: center;
    }

    /* Chat Messages */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-bubble {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .ai-bubble {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .speak-icon {
      margin-left: 8px;
      cursor: pointer;
      color: var(--neon-blue);
      vertical-align: middle;
    }

    /* Bottom Siri Dock */
    footer {
      background: rgba(6, 8, 20, 0.95);
      border-top: 1px solid var(--border);
      padding: 12px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      height: 18px;
    }

    /* Siri-style Glowing Microphone */
    .mic-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-glow {
      position: absolute;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--neon-blue), var(--neon-purple));
      opacity: 0.3;
      filter: blur(12px);
      transition: all 0.3s;
    }

    .mic-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
      position: relative;
      transition: transform 0.2s;
    }

    .mic-btn svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .mic-btn.listening {
      animation: siriPulse 1.2s infinite alternate;
      border-color: #38bdf8;
      box-shadow: 0 0 30px var(--neon-blue), inset 0 0 10px #ffffff;
    }

    @keyframes siriPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    /* Text Input Area */
    .input-row {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 25px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-row input:focus {
      border-color: var(--neon-blue);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <div class="brand-glow"></div>
      <div class="brand-name">Apna AI</div>
    </div>
    <button class="btn-search" id="btn-google">
      🔍 Google
    </button>
  </header>

  <!-- Notification Banner -->
  <div id="alert-box"></div>

  <!-- Chat History -->
  <main id="chat-box">
    <div class="bubble ai-bubble">
      नमस्ते! मैं हूँ आपका <b>Apna AI</b> इंटरफ़ेस। नीचे दिए गए माइक को दबाकर बोलें या लिखकर भेजें। ✨
    </div>
  </main>

  <!-- Controls -->
  <footer>
    <div class="status-text" id="status-text">Mic दबाएं और बोलना शुरू करें</div>

    <!-- Animated Siri Mic Orb -->
    <div class="mic-wrapper">
      <div class="mic-glow"></div>
      <button class="mic-btn" id="btn-mic" aria-label="Microphone">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>

    <!-- Text Input -->
    <div class="input-row">
      <input type="text" id="text-input" placeholder="Hindi ya Hinglish me type karein..." autocomplete="off" />
      <button class="send-btn" id="btn-send" aria-label="Send">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const textInput = document.getElementById('text-input');
    const btnSend = document.getElementById('btn-send');
    const btnMic = document.getElementById('btn-mic');
    const btnGoogle = document.getElementById('btn-google');
    const statusText = document.getElementById('status-text');
    const alertBox = document.getElementById('alert-box');

    let isListening = false;
    let lastQuery = "";

    // 1. Error Banner
    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    // 2. Add Message Bubble
    function addMessage(text, sender = 'ai') {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble', sender === 'user' ? 'user-bubble' : 'ai-bubble');

      if (sender === 'ai') {
        bubble.innerHTML = `${text} <span class="speak-icon" title="बोलकर सुनें">🔊</span>`;
        bubble.querySelector('.speak-icon').addEventListener('click', () => speakHindi(text));
      } else {
        bubble.textContent = text;
      }

      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 3. Hindi Text-to-Speech
    function speakHindi(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      const clean = text.replace(/<[^>]*>?/gm, ''); // strip HTML
      const utterance = new SpeechSynthesisUtterance(clean);

      const voices = window.speechSynthesis.getVoices();
      const hindiVoice = voices.find(v => /^hi(-|_)?IN$/i.test(v.lang)) ||
                         voices.find(v => v.lang.toLowerCase().startsWith('hi')) ||
                         voices.find(v => v.lang.toLowerCase() === 'en-in');

      utterance.lang = hindiVoice ? hindiVoice.lang : 'hi-IN';
      if (hindiVoice) utterance.voice = hindiVoice;
      utterance.rate = 0.92;
      utterance.pitch = 1;

      utterance.onstart = () => {
        statusText.textContent = "Apna AI बोल रहा है...";
      };
      utterance.onend = () => {
        if (!isListening) statusText.textContent = "Mic दबाएं और बोलना शुरू करें";
      };
      utterance.onerror = (event) => {
        console.warn("Text-to-speech error:", event.error);
        statusText.textContent = "आवाज़ उपलब्ध नहीं हुई। फोन की Text-to-speech सेटिंग जाँचें।";
      };

      // Some mobile browsers need speech synthesis to be resumed before speaking.
      window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // 4. Voice Input (Speech Recognition)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN'; // Hindi & Hinglish

      recognition.onstart = () => {
        isListening = true;
        btnMic.classList.add('listening');
        statusText.textContent = "सुन रहा हूँ... बोलिए";
      };

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        textInput.value = transcript;
        handleMessage(transcript);
      };

      recognition.onerror = (e) => {
        isListening = false;
        btnMic.classList.remove('listening');
        if (e.error === 'not-allowed') {
          showAlert("माइक की अनुमति नहीं मिली! Chrome Settings में जाकर Microphone Allow करें।");
        } else if (e.error === 'no-speech') {
          statusText.textContent = "कोई आवाज़ नहीं आई। फिर से प्रयास करें।";
        } else {
          showAlert(`Speech Error: ${e.error}`);
        }
      };

      recognition.onend = () => {
        isListening = false;
        btnMic.classList.remove('listening');
        statusText.textContent = "Mic दबाएं और बोलना शुरू करें";
      };
    } else {
      statusText.textContent = "इस ब्राउज़र में voice input उपलब्ध नहीं है";
      showAlert("इस ब्राउज़र में Speech Recognition सपोर्ट नहीं है। Android Chrome में खोलकर प्रयास करें; टाइप करके भी भेज सकते हैं।");
    }

    btnMic.addEventListener('click', async () => {
      if (!SpeechRecognition) {
        showAlert("Speech Recognition उपलब्ध नहीं है।");
        return;
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      try {
        if (!window.isSecureContext) {
          showAlert("माइक के लिए HTTPS वेबसाइट को Chrome में खोलें।");
          return;
        }
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
        }
        recognition.start();
      } catch (err) {
        console.error("Microphone error:", err);
        if (err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError")) {
          showAlert("Chrome Site settings में Microphone को Allow करें।");
        } else if (err && err.name === "NotFoundError") {
          showAlert("इस डिवाइस पर माइक्रोफोन नहीं मिला।");
        } else {
          showAlert("माइक शुरू नहीं हो पाया: " + (err && err.message ? err.message : "फिर से प्रयास करें"));
        }
      }
    });

    // 5. Message Processing
    // IMPORTANT: Set this to your deployed HTTPS backend URL.
    // Do NOT put your OpenAI API key in this file.
    const API_ENDPOINT = "PASTE_YOUR_SECURE_BACKEND_URL_HERE";

    async function handleMessage(customText = null) {
      const text = (customText || textInput.value).trim();
      if (!text) return;

      lastQuery = text;
      addMessage(text, 'user');
      textInput.value = '';
      btnSend.disabled = true;
      statusText.textContent = "AI जवाब तैयार कर रहा है...";

      if (!API_ENDPOINT || API_ENDPOINT.includes("PASTE_YOUR_SECURE_BACKEND_URL_HERE")) {
        const reply = "मैंने आपका मैसेज सुन लिया है। अभी मेरा असली AI कनेक्शन सेट नहीं है, इसलिए मैं हर सवाल का जवाब खुद नहीं बना सकता।";
        addMessage(reply, 'ai');
        speakHindi(reply);
        btnSend.disabled = false;
        statusText.textContent = "जवाब दे दिया। फिर बोलने के लिए Mic दबाएं";
        return;
      }

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `Server error (${response.status})`);
        }

        const answer = data.reply || data.answer || data.output_text;
        if (!answer) throw new Error("Backend ने जवाब नहीं भेजा।");
        addMessage(answer, 'ai');
        speakHindi(answer);
      } catch (err) {
        console.error("AI request failed:", err);
        addMessage("OpenAI से जवाब नहीं मिल पाया। Backend URL, server और network जाँचें।", 'ai');
        showAlert("AI कनेक्शन में समस्या: " + (err.message || "Unknown error"));
      } finally {
        btnSend.disabled = false;
        statusText.textContent = "Mic दबाएं और बोलना शुरू करें";
      }
    }

    btnSend.addEventListener('click', () => handleMessage());
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleMessage();
    });

    // 6. Google Search Redirection
    btnGoogle.addEventListener('click', () => {
      const query = lastQuery || textInput.value.trim();
      if (query) {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
      } else {
        window.open('https://www.google.com', '_blank');
      }
    });
  </script>
</body>
</html>
